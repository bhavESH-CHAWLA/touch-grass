<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Touch Grass: a loop for your free hour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --sky:#E4EEF1; --pine:#10301F; --moss:#2F6B3F; --grass:#6CC24A; --blaze:#FFC93C;
  --soft:rgba(16,48,31,.68); --line:rgba(16,48,31,.18); --card:#F6FAFB;
  --sans:"Bricolage Grotesque",system-ui,sans-serif; --serif:"Source Serif 4",Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sky);color:var(--pine);font-family:var(--serif);font-size:18px;line-height:1.55;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:20px 20px 56px}
:focus-visible{outline:3px solid var(--blaze);outline-offset:3px;box-shadow:0 0 0 6px var(--pine)}
.brand{font:800 20px/1 var(--sans);margin:0 0 8px;letter-spacing:-.01em}

/* hero: the minutes dial */
.dial{position:relative;display:grid;place-items:center;height:min(78vw,330px);margin:0 auto}
.loop{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.loop path{fill:none;stroke:var(--grass);stroke-width:9;stroke-linecap:round;stroke-dasharray:2 15;
  transform-origin:100px 100px;transform:scale(var(--s,.8));transition:transform .25s ease}
.num{position:relative;text-align:center;font-family:var(--sans)}
.num output{display:block;font-weight:800;font-size:clamp(92px,30vw,150px);line-height:.9;letter-spacing:-.04em}
.num span{display:block;font-size:19px;font-weight:500;margin-top:4px}
input[type=range]{width:100%;margin:6px 0 18px;accent-color:var(--moss);height:36px}
.where{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:16px;color:var(--soft)}
button{font:700 17px/1 var(--sans);border:2px solid var(--pine);border-radius:999px;padding:14px 20px;background:transparent;
  color:var(--pine);cursor:pointer;min-height:48px}
button.primary{background:var(--grass);width:100%;font-size:20px;padding:18px;box-shadow:0 4px 0 var(--pine)}
button.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pine)}
button[disabled]{opacity:.6;cursor:progress}

/* result */
#result{margin-top:36px}
.wx{font:600 16px/1.4 var(--sans);padding:12px 14px;border-left:8px solid var(--grass);background:var(--card);margin:0 0 22px}
.wx[data-v=caution]{border-color:var(--blaze)} .wx[data-v=skip]{border-color:var(--pine)}
h2{font:800 clamp(30px,8vw,40px)/1.05 var(--sans);letter-spacing:-.02em;margin:0 0 10px}
.intro{margin:0 0 6px}
.stats{font:500 16px var(--sans);color:var(--soft);margin:0 0 16px}
#map{height:250px;border:2px solid var(--pine);margin:0 0 6px;background:#d3e2e6}
.maptip{font-size:14px;color:var(--soft);margin:0 0 22px}
ol.trail{list-style:none;margin:0 0 20px;padding:0 0 0 30px;position:relative}
ol.trail::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;border-left:3px dotted var(--moss)}
ol.trail li{position:relative;margin:0 0 16px}
ol.trail li::before{content:"";position:absolute;left:-30px;top:5px;width:14px;height:14px;border-radius:50%;
  background:var(--sky);border:3px solid var(--pine)}
ol.trail li.stop::before{background:var(--blaze)}
ol.trail b{font:700 19px var(--sans);display:block}
ol.trail small{font:500 14px var(--sans);color:var(--soft)}
.dir{display:inline-block;font:700 16px var(--sans);color:var(--pine);margin-bottom:28px}
h3{font:800 24px/1.1 var(--sans);margin:0 0 10px}
ul.notice{list-style:none;margin:0 0 18px;padding:0}
ul.notice li{margin:0 0 4px}
ul.notice label{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
ul.notice input{width:22px;height:22px;margin-top:3px;accent-color:var(--moss);flex:none}
ul.notice input:checked + span{text-decoration:line-through;color:var(--soft)}
.tip{font-style:italic;margin:0 0 26px}
.warn{font:500 15px var(--sans);background:var(--card);padding:10px 12px;margin:0 0 8px;border-left:8px solid var(--blaze)}
.credit{font:500 13px/1.5 var(--sans);color:var(--soft);margin-top:30px}
.credit a{color:inherit}
#log{font:600 15px var(--sans);margin-top:40px;padding-top:14px;border-top:2px solid var(--pine)}
.err{font:600 16px var(--sans);padding:12px 14px;border-left:8px solid var(--pine);background:var(--card);margin-top:20px}

/* phone-away mode */
#walk{position:fixed;inset:0;background:var(--pine);color:var(--sky);display:grid;place-items:center;text-align:center;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));z-index:1000}
#walk[hidden]{display:none}
#walk .big{font:800 clamp(80px,26vw,140px)/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
#walk p{font-size:20px;margin:8px 0 28px}
#walk button{border-color:var(--sky);color:var(--sky);margin:6px}
#walk button.primary{color:var(--pine);background:var(--blaze);border-color:var(--blaze);width:auto;box-shadow:none}
.leaflet-container{font-family:var(--sans)}
@media (prefers-reduced-motion:reduce){.loop path{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="brand">Touch Grass</p>
    <div class="dial">
      <svg class="loop" viewBox="0 0 200 200" aria-hidden="true">
        <path d="M100 28 C150 20 180 60 172 105 C165 150 120 178 84 168 C40 158 22 118 36 80 C48 48 70 32 100 28Z"/>
      </svg>
      <label class="num" for="minutes"><output id="minOut" for="minutes">30</output><span>minutes free</span></label>
    </div>
    <input type="range" id="minutes" min="15" max="60" step="5" value="30" aria-label="Minutes free">
    <div class="where">
      <span id="whereLabel">Chandigarh University campus (default)</span>
      <button id="locate" type="button">Use my location</button>
    </div>
    <button id="find" class="primary" type="button">Find my loop</button>
    <div id="status" role="status" aria-live="polite"></div>
  </header>

  <main id="result" hidden>
    <p id="wx" class="wx"></p>
    <h2 id="title"></h2>
    <p id="intro" class="intro"></p>
    <p id="stats" class="stats"></p>
    <div id="map" role="img" aria-label="Map of your loop"></div>
    <p class="maptip">The dashed line is the rough shape. Use the directions link for the exact streets.</p>
    <ol id="trail" class="trail"></ol>
    <a id="dir" class="dir" target="_blank" rel="noopener">Open walking directions</a>
    <h3>What to notice</h3>
    <ul id="notice" class="notice"></ul>
    <p id="tip" class="tip"></p>
    <div id="warnings"></div>
    <button id="start" class="primary" type="button">Start walk, phone away</button>
    <p id="credit" class="credit"></p>
  </main>

  <p id="log"></p>
</div>

<div id="walk" hidden role="dialog" aria-modal="true" aria-labelledby="walkMsg">
  <div>
    <div class="big" id="clock">00:00</div>
    <p id="walkMsg">Phone in your pocket. Be back by <b id="backBy"></b>.</p>
    <button id="walkDone" class="primary" type="button" hidden>Log this walk</button>
    <button id="walkCancel" type="button">End early</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const DEFAULT = { lat: 30.7685, lon: 76.5753, label: "Chandigarh University campus (default)" };
let center = { ...DEFAULT }, map, layer, current, timer;

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; }

/* dial */
function syncDial(){
  const v = +$("#minutes").value;
  $("#minOut").textContent = v;
  document.documentElement.style.setProperty("--s", (0.5 + (v - 15) / 45 * 0.5).toFixed(2));
}
$("#minutes").addEventListener("input", syncDial); syncDial();

/* location */
$("#locate").addEventListener("click", () => {
  if(!navigator.geolocation){ $("#status").textContent = "This browser can't share a location. Using the campus default."; return; }
  $("#status").textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(p => {
    center = { lat: p.coords.latitude, lon: p.coords.longitude };
    $("#whereLabel").textContent = "Your location (±" + Math.round(p.coords.accuracy) + " m)";
    $("#status").textContent = "";
  }, () => { $("#status").textContent = "Location was blocked. Allow it in your browser settings, or keep the campus default."; },
  { enableHighAccuracy: true, timeout: 10000 });
});

/* plan */
$("#find").addEventListener("click", async () => {
  const btn = $("#find"), minutes = +$("#minutes").value;
  btn.disabled = true; $("#status").textContent = "Reading the map and the sky. A small local model takes up to a minute.";
  document.querySelectorAll(".err").forEach(e => e.remove());
  try{
    const r = await fetch("/api/plan", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lat: center.lat, lon: center.lon, minutes }) });
    const data = await r.json();
    if(!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "The planner rejected that request.");
    render(data); $("#status").textContent = "";
  }catch(e){
    $("#status").textContent = "";
    $("#find").after(el("div","err", "Couldn't build a plan: " + e.message + " Check your connection and try again."));
  }finally{ btn.disabled = false; }
});

function render(d){
  current = d;
  const n = d.narration, loop = d.loop;
  $("#result").hidden = false;
  const wx = $("#wx");
  if(d.weather){ wx.hidden = false; wx.dataset.v = d.weather.verdict; wx.textContent = d.weather.headline; } else wx.hidden = true;
  $("#title").textContent = n.title; $("#intro").textContent = n.intro;
  $("#stats").textContent = loop.km + " km, about " + loop.minutes + " minutes of walking" + (loop.minutes > d.minutes ? " (a little over your " + d.minutes + ")" : "");

  const trail = $("#trail"); trail.replaceChildren();
  const first = el("li"); first.append(el("b",null,"Start"), el("small",null,"Where you are now")); trail.append(first);
  loop.stops.forEach((s, i) => {
    const li = el("li","stop"); li.append(el("b",null,s.name), el("small",null,s.kind === "street" ? "Turn-around point" : s.kind));
    if(n.stop_notes[i]) li.append(el("div",null,n.stop_notes[i])); trail.append(li);
  });
  const last = el("li"); last.append(el("b",null,"Back to start")); trail.append(last);

  const ul = $("#notice"); ul.replaceChildren();
  n.notice.forEach(t => { const li = el("li"), lab = el("label"), cb = el("input"); cb.type = "checkbox"; lab.append(cb, el("span",null,t)); li.append(lab); ul.append(li); });
  $("#tip").textContent = n.tip || "";
  $("#dir").href = d.directions_url;
  const w = $("#warnings"); w.replaceChildren(); d.warnings.forEach(t => w.append(el("p","warn",t)));
  $("#credit").textContent = (d.narrator === "template" ? "Text: built-in template. " : "Text written by " + d.narrator + ", an open-weight model. ")
    + "Map data from OpenStreetMap contributors. Weather from Open-Meteo.";
  drawMap(d);
  $("#result").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

function drawMap(d){
  if(typeof L === "undefined"){ $("#map").hidden = true; return; }
  $("#map").hidden = false;
  if(!map){
    map = L.map("map", { scrollWheelZoom: false });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
  }
  if(layer) layer.remove();
  layer = L.layerGroup().addTo(map);
  const pts = [[d.start.lat, d.start.lon], ...d.loop.stops.map(s => [s.lat, s.lon]), [d.start.lat, d.start.lon]];
  L.polyline(pts, { color: "#10301F", weight: 4, dashArray: "2 10", lineCap: "round" }).addTo(layer);
  L.circleMarker(pts[0], { radius: 9, color: "#10301F", weight: 3, fillColor: "#E4EEF1", fillOpacity: 1 }).bindTooltip("Start").addTo(layer);
  d.loop.stops.forEach(s => L.circleMarker([s.lat, s.lon], { radius: 9, color: "#10301F", weight: 3, fillColor: "#FFC93C", fillOpacity: 1 }).bindTooltip(s.name).addTo(layer));
  map.invalidateSize(); map.fitBounds(pts, { padding: [28, 28] });
}

/* phone-away walk */
function fmt(ms){ const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2,"0") + ":" + String(s % 60).padStart(2,"0"); }
$("#start").addEventListener("click", () => {
  const end = Date.now() + current.loop.minutes * 60000;
  $("#backBy").textContent = new Date(end).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  $("#walkDone").hidden = true; $("#walkCancel").hidden = false; $("#walk").hidden = false; $("#walkCancel").focus();
  const tick = () => {
    const left = end - Date.now(); $("#clock").textContent = fmt(left);
    if(left <= 0){ clearInterval(timer); finish(); }
  };
  clearInterval(timer); tick(); timer = setInterval(tick, 500);
});
function finish(){
  $("#walkMsg").textContent = "Time's up. Head back, then log it.";
  $("#walkDone").hidden = false; $("#walkCancel").hidden = true; $("#walkDone").focus();
  try{ navigator.vibrate && navigator.vibrate([300,120,300]);
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator();
    o.frequency.value = 660; o.connect(a.destination); o.start(); o.stop(a.currentTime + 0.4);
  }catch(e){}
}
$("#walkCancel").addEventListener("click", () => { clearInterval(timer); $("#walk").hidden = true; });
$("#walkDone").addEventListener("click", () => {
  const noticed = document.querySelectorAll("#notice input:checked").length;
  saveLog({ t: Date.now(), mins: current.loop.minutes, noticed }); $("#walk").hidden = true; showLog();
});

/* tiny local log (stays on this device) */
function readLog(){ try{ return JSON.parse(localStorage.getItem("tg-log") || "[]"); }catch(e){ return []; } }
function saveLog(entry){ try{ const l = readLog(); l.push(entry); localStorage.setItem("tg-log", JSON.stringify(l.slice(-200))); }catch(e){} }
function showLog(){
  const l = readLog(), p = $("#log");
  if(!l.length){ p.textContent = "Your grass log is empty. The first walk is the hardest."; return; }
  const day = t => new Date(t).toDateString(), days = new Set(l.map(e => day(e.t)));
  let streak = 0, d = new Date(); if(!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  while(days.has(d.toDateString())){ streak++; d.setDate(d.getDate() - 1); }
  const week = l.filter(e => Date.now() - e.t < 7 * 864e5);
  p.textContent = "Last 7 days: " + week.length + " walk" + (week.length === 1 ? "" : "s") + ", " + week.reduce((a,e) => a + e.mins, 0)
    + " minutes outside. Streak: " + streak + " day" + (streak === 1 ? "" : "s") + ". Saved on this device only.";
}
showLog();
</script>
</body>
</html>
